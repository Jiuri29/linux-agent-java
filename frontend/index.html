<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Linux AIOps Agent 安全智能运维控制台：实时监控、受控终端、文件管理、风险扫描与合规审计" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f6bff'/%3E%3Cstop offset='1' stop-color='%236ea8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Crect x='12' y='12' width='24' height='24' rx='4' fill='none' stroke='white' stroke-width='3'/%3E%3Crect x='20' y='20' width='8' height='8' rx='2' fill='white'/%3E%3C/svg%3E" />
    <title>Linux AIOps 安全运维 Agent 控制台</title>
  </head>
  <body>
    <script>
      // 首屏前定主题，避免暗色模式下闪一下白底
      (function () {
        try {
          var s = localStorage.getItem('ops_theme_dark')
          var dark =
            s === '1' ? true : s === '0' ? false : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 不可用时退回浅色 */
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
